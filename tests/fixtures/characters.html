<!doctype html><html lang="en"><head><meta charset="utf-8"><title>v1.1 character inspection fixture</title><style>body{margin:0;background:#151923;color:#eee;font:16px system-ui}h1{font-size:20px}canvas{image-rendering:pixelated;max-width:100%;border:1px solid #484852}.triptych{display:flex;gap:8px}.triptych>div{flex:1}#comparison{width:1200px}small{color:#dfcf91}</style></head><body><h1>PixelFX source / released v1.0 / v1.1 candidate · character comparison</h1><div class="triptych"><div>PixelFX demonstration rig (unmodified)<canvas id="upstream" width="400" height="300"></canvas></div><div>Released v1.0 independently drawn actors<canvas id="old" width="400" height="300"></canvas></div><div>v1.1 original rig + project Orc derivative<canvas id="new" width="400" height="300"></canvas></div></div><small id="description"></small><h1>Same encounter fixture — released v1.0 (top), v1.1 candidate (bottom)</h1><canvas id="baseline" width="640" height="360"></canvas><canvas id="candidate" width="640" height="360"></canvas><script type="module">
import {Renderer as V1} from './v1-render.js';import{Renderer}from'../../src/render.js';import{heroPose,heroPixels,HERO_SCALE}from'../../src/characters/hero.js';import{orcPose,orcPixels,ORC_SCALE}from'../../src/characters/orc.js';import{drawRig}from'../../src/characters/draw.js';import{posed as originalPosed,skeleton}from'../../vendor/pixelfx/src/core/rig.js';import{ACTIONS}from'../../src/simulation.js';
const $=id=>document.getElementById(id),old=new V1($('baseline')),candidate=new Renderer($('candidate'));function backdrop(c){const x=c.getContext('2d');x.fillStyle='#252937';x.fillRect(0,0,c.width,c.height);x.fillStyle='#4d5362';x.fillRect(0,250,c.width,2);return x;}
window.inspect=(key=null,age=0,bossState='walk',time=1)=>{
 const a=key?{key,...ACTIONS[key],age,origin:100,targets:[],projectile:200,fired:false}:null;const g={time,x:100,action:a,blessedUntil:0,immuneUntil:0,enemies:[]};const e={id:1,x:410,kind:'boss',hp:4,r:23,wind:bossState==='wind'?time+.85-age:0,recover:bossState==='recovery'?time+2-age:0,flash:0};g.enemies=[e,{id:2,x:530,kind:'skull',hp:1,r:13,recover:0}];
 const q=heroPose(g,key?0:1),oq=orcPose(e,time);
 drawRig(backdrop($('upstream')),originalPosed(q),q,120,250,3);const ctx=backdrop($('new'));drawRig(ctx,heroPixels(q),q,90,250,3);drawRig(ctx,orcPixels(oq),oq,295,250,3,true);
 const oldCtx=backdrop($('old'));const saved=old.ctx;old.ctx=oldCtx;oldCtx.save();oldCtx.translate(90,250);oldCtx.scale(1.8,1.8);oldCtx.translate(0,-286);old.hero({...g,x:0},key?0:1);oldCtx.restore();oldCtx.save();oldCtx.translate(295,250);oldCtx.scale(1.5,1.5);oldCtx.translate(0,-286);old.boss({...e,x:0},time);oldCtx.restore();old.ctx=saved;
 // Reset FX between independently sampled fixture states, then render an actual arena frame.
 for(const r of [old,candidate]){r.active=null;r.fx=null;r.iceFx=null;r.skulls.clear();r.render(g,key?0:1);}
 $('description').textContent=`${key?'Action '+key+' at '+age.toFixed(2)+'s':'Walk'} · king ${bossState} · time ${time}`;
 return{heroPixels:heroPixels(q).n,originalPixels:originalPosed(q).n,orcPixels:orcPixels(oq).n,heroSkeleton:skeleton(q)};
};
window.renderers={old,candidate};window.inspect();
</script></body></html>
